<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Setup — 开发环境仪表盘</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header>
            <h1>&#9881; 开发环境仪表盘</h1>
            <p class="subtitle">Git Bash + Miniconda + Node.js + Claude Code</p>
        </header>

        <!-- 状态卡片 -->
        <section class="cards" id="status-cards">
            <div class="card" id="card-git">
                <div class="card-icon">&#128187;</div>
                <div class="card-info">
                    <span class="card-name">Git Bash</span>
                    <span class="card-status loading">检测中...</span>
                </div>
            </div>
            <div class="card" id="card-conda">
                <div class="card-icon">&#128230;</div>
                <div class="card-info">
                    <span class="card-name">Conda</span>
                    <span class="card-status loading">检测中...</span>
                </div>
            </div>
            <div class="card" id="card-node">
                <div class="card-icon">&#128295;</div>
                <div class="card-info">
                    <span class="card-name">Node.js</span>
                    <span class="card-status loading">检测中...</span>
                </div>
            </div>
            <div class="card" id="card-claude">
                <div class="card-icon">&#129302;</div>
                <div class="card-info">
                    <span class="card-name">Claude Code</span>
                    <span class="card-status loading">检测中...</span>
                </div>
            </div>
        </section>

        <!-- 后端配置面板 -->
        <section class="panel" id="api-panel">
            <h2>AI 后端配置</h2>
            <div class="form-row">
                <label>后端 URL</label>
                <input type="text" id="api-url" placeholder="https://api.deepseek.com/anthropic" readonly>
            </div>
            <div class="form-row">
                <label>模型</label>
                <input type="text" id="api-model" placeholder="未配置" readonly>
            </div>
            <div class="form-row">
                <label>API Key</label>
                <input type="password" id="api-key" value="****" readonly>
            </div>
            <div class="form-row">
                <button id="btn-test-api" onclick="testApiConnection()">测试连接</button>
                <span id="api-test-result"></span>
            </div>
        </section>

        <!-- 代理配置面板 -->
        <section class="panel" id="proxy-panel">
            <h2>代理 / VPN 配置</h2>
            <div class="form-row">
                <label>代理地址</label>
                <input type="text" id="proxy-url" placeholder="未配置代理" readonly>
            </div>
        </section>

        <!-- 安装日志 -->
        <section class="panel" id="log-panel">
            <h2>安装日志</h2>
            <pre id="log-output">暂无日志</pre>
        </section>

        <!-- 快捷操作 -->
        <section class="panel" id="quick-actions">
            <h2>快捷操作</h2>
            <div class="actions">
                <button onclick="openGitBash()">打开 Git Bash</button>
                <button onclick="openConfig()">查看配置文件</button>
                <a href="https://docs.anthropic.com/en/docs/claude-code" target="_blank">
                    <button>Claude Code 文档</button>
                </a>
            </div>
        </section>

        <footer>
            <p>Dev Setup v1.0 | 基于 Git Bash 构建</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
